<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GPT-Load 只读运维监控台登录入口。">
  <title>登录 | GPT-Load 监控台</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="page-login">
  <main class="login-shell" aria-labelledby="login-heading">
    <section class="login-panel">
      <header class="login-header">
        <h1 id="login-heading" class="login-title">GPT-Load 监控台</h1>
        <p class="login-subtitle">只读运维视图，请输入共享查看密码继续。</p>
      </header>

      {{if .Error}}
      <div class="alert alert--error" id="login-error" role="alert">
        <p class="alert-text">{{.Error}}</p>
      </div>
      {{end}}

      <form class="login-form" method="post" action="/login">
        <div class="field">
          <label class="field-label" for="password">查看密码</label>
          <input
            class="field-input"
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            autofocus
            placeholder="请输入查看密码"
            {{if .Error}}aria-invalid="true" aria-describedby="login-error"{{end}}
          >
        </div>
        <button class="btn btn--primary btn--full" type="submit">登录</button>
      </form>
    </section>
  </main>
</body>
</html>
